<footer id="contact">
  <div class="wrap">
    <h2>Want to connect?</h2>
    <div class="section-divider"><span class="line"></span><span class="hex"></span><span class="line"></span></div>

    <form action="https://formspree.io/f/mrevkell" method="POST" name="sentMessage" id="contactForm" class="contact-form content-panel" novalidate>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" placeholder="Your name" required
          data-validation-required-message="Please enter your name.">
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" name="_replyto" id="email" placeholder="you@example.com" required
          data-validation-required-message="Please enter your email address.">
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" name="_subject" id="subject" placeholder="What's this about?" required
          data-validation-required-message="Please enter a subject.">
      </div>
      <input type="text" name="_gotcha" class="form-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="form-group">
        <label for="message">Message</label>
        <textarea rows="5" name="message" id="message" placeholder="What are you working on?" required
          data-validation-required-message="Please enter a message."></textarea>
      </div>
      <div id="form-success" class="form-success" role="status" aria-live="polite"></div>
      <button type="submit" class="btn-send">Send Message</button>
    </form>
  </div>
</footer>
